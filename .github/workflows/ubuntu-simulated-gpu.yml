name: Ubuntu (simulated GPU)

# ubuntu.yml builds Cupoch and its unit tests but does not run them, since
# GitHub's runners have no GPU. PantheonSim simulates an NVIDIA A10G (sm_86,
# the architecture the build targets) on the runner's CPU, so the unit tests
# run here. It checks results, not speed; a real GPU is still the final word.
on:
  push:
    branches: [ main, ci-simulated-gpu ]
  pull_request:
    branches: [ main ]

# The job reads the repository and nothing else. The simulator's action uses
# no token or secrets, and installs packages only from Ubuntu and NVIDIA.
permissions:
  contents: read

jobs:
  unittests:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Simulated GPU (NVIDIA A10G) and CUDA 12.8
      uses: pantheongpu/pantheonsim@c96ec7e0c3cf4e01491070bc87b739dd73d5f560 # pantheonsim 335, 336, 337, 343, 344, rehearsal
      with:
        gpu: nvidia/a10g
        cuda-toolkit: '12.8'
    # The action installs the compiler and the runtime; Cupoch (through RMM,
    # Thrust and its own code) also builds against these.
    - name: The rest of the CUDA libraries Cupoch builds against
      run: |
        sudo apt-get install -y --no-install-recommends cuda-nvtx-12-8 cuda-cccl-12-8 \
          libcusolver-dev-12-8 libcusparse-dev-12-8 libcurand-dev-12-8 libcufft-dev-12-8
    # RMM includes <nvtx3/nvtx3.hpp>, which the packages above do not carry:
    # NVIDIA publishes it as a header-only library (Apache-2.0).
    - name: NVTX headers
      run: |
        git clone -q https://github.com/NVIDIA/NVTX.git "$RUNNER_TEMP/NVTX"
        git -C "$RUNNER_TEMP/NVTX" checkout -q e170594ac7cf1dac584da473d4ca9301087090c1   # v3.1.0
        echo "CPATH=/usr/local/cuda-12.8/include:$RUNNER_TEMP/NVTX/c/include" >> "$GITHUB_ENV"
    - name: Install dependencies
      run: ./scripts/actions/install_deps_ubuntu.sh
    # The simulator stands in for the CUDA runtime at run time, so the shared
    # one is linked (the second option is for the FindCUDA module).
    - name: CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_GLEW=ON -DBUILD_GLFW=ON -DBUILD_PNG=ON -DBUILD_JSONCPP=ON \
          -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared -DCUDA_USE_STATIC_CUDA_RUNTIME=OFF
    - name: Build the unit tests
      run: |
        cd build
        make -j"$(nproc)" unittests
    - name: Unit tests on the simulated GPU
      continue-on-error: true
      run: |
        cd build
        vgpu run "$(find . -name unittests -type f | head -n 1)"
    - name: Trace the kd-tree builder (diagnostic)
      run: |
        cd build
        U="$(find . -name unittests -type f | head -n 1)"
        for w in 0 1 2 3 4 5 6 7; do
          VGPU_SASS_TRACE=$w VGPU_SASS_TRACE_KERNEL=SplitNodes timeout 900 vgpu run "$U" --gtest_filter=KDTreeFlann.SearchKNN > /tmp/t$w.txt 2>&1 || true
          N="$(grep -n 'VirtualGPU error' /tmp/t$w.txt | head -n 1 | cut -d: -f1)"
          echo "== warp $w (error at line ${N:-none}, $(wc -l < /tmp/t$w.txt) lines)"
          [ -n "$N" ] && sed -n "$((N-14)),$((N-1))p" /tmp/t$w.txt | cut -c1-150
        done
        grep -n -E 'BSSY|BSYNC|BMOV|BAR|EXIT|WARPSYNC|CALL|RET' /tmp/t0.txt | head -80 | cut -c1-120
